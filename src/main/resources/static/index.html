<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Estoque Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #cbd5e1;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 24px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
            gap: 16px;
            align-items: flex-end;
        }

        .input-block {
            display: flex;
            vertical-align: middle;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
        }

        input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 11px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            color: var(--text-light);
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            background: #f8fafc;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .btn-delete {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Gerenciador de Estoque <span style="font-size: 1rem; background: #3b82f6; color: white; padding: 4px 8px; border-radius: 20px;">PostgreSQL</span></h1>
    
    <!-- Formulário -->
    <div class="card">
        <form id="productForm" class="form-group">
            <div class="input-block">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" placeholder="Ex: Monitor" required>
            </div>
            <div class="input-block">
                <label for="quantidade">Qtd em Estoque</label>
                <input type="number" id="quantidade" placeholder="0" required min="0">
            </div>
            <div class="input-block">
                <label for="preco">Preço Unitário</label>
                <input type="number" id="preco" placeholder="0.00" required step="0.01" min="0">
            </div>
            <button type="submit">Adicionar</button>
        </form>
    </div>

    <!-- Tabela -->
    <div class="card" style="padding: 0; overflow: hidden;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos">
                <!-- Inserido dinamicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/produtos';

    async function carregarProdutos() {
        const response = await fetch(API_URL);
        const produtos = await response.json();
        const tbody = document.getElementById('tabelaProdutos');
        tbody.innerHTML = '';

        produtos.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>#${p.id}</td>
                    <td><strong>${p.nome}</strong></td>
                    <td>${p.quantidade} un</td>
                    <td>R$ ${p.preco.toFixed(2)}</td>
                    <td>
                        <button class="btn-delete" onclick="deletarProduto(${p.id})">Excluir</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const data = {
            nome: document.getElementById('nome').value,
            quantidade: parseInt(document.getElementById('quantidade').value),
            preco: parseFloat(document.getElementById('preco').value)
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        document.getElementById('productForm').reset();
        carregarProdutos();
    });

    async function deletarProduto(id) {
        if(confirm("Tem certeza que deseja excluir?")) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            carregarProdutos();
        }
    }

    carregarProdutos();
</script>

</body>
</html>
